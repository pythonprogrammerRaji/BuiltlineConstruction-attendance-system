<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow p-4" style="width:420px; border-radius:20px;">

        <h2 class="text-center mb-4">
            Login
        </h2>

        <!-- Buttons -->
        <div class="d-flex gap-2 mb-4">

            <button class="btn btn-primary w-100"
                onclick="showForm('admin')">
                Admin
            </button>

            <button class="btn btn-success w-100"
                onclick="showForm('engineer')">
                Site Engineer
            </button>

            <button class="btn btn-dark w-100"
                onclick="showForm('office')">
                Office Staff
            </button>

        </div>

        <!-- Login Form -->
        <form method="POST" action="/login">

            <input type="hidden"
                name="role"
                id="role">

            <div class="mb-3">
                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >
            </div>

            <!-- Admin key hidden -->
            <div class="mb-3 d-none"
                id="adminKeyDiv">

                <label>Admin Secret Key</label>

                <input
                    type="text"
                    name="admin_key"
                    class="form-control"
                >
            </div>

            <button class="btn btn-primary w-100">
                Login
            </button>

        </form>

    </div>

</div>

<script>
function showForm(role){

    document.getElementById("role").value = role;

    let adminDiv =
        document.getElementById("adminKeyDiv");

    if(role === "admin"){
        adminDiv.classList.remove("d-none");
    }else{
        adminDiv.classList.add("d-none");
    }
}
</script>

</body>
</html>
