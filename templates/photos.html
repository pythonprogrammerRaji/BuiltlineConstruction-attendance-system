<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
</head>
<body>
    <section class="container-fuild">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm px-4">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold fs-4" href="/admin-dashboard">BUILTLINE CONSTRICTION  </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active text-white" href="/admin-dashboard">Dashboard</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="/history">History</a>
                        </li>

                        <li class="nav-item">       
                            <a class="nav-link text-white" href="/photos">Photos</a>
                        </li>

                        <li class="nav-item">
                         <a class="nav-link text-white" href="/office-dashboard">Office Staff</a>
                        </li>

                        <li class="nav-item">
                         <a class="nav-link text-white" href="/engineer_page">Projects</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="/logout">Logout</a>
                        </li>
                    </ul>

                </div>

            </div>
        </nav>

    
    <h2 class="text-center pt-2">Site Photos</h2>

    <div class="row px-4">

        {% for photo in photos %}
        <div class="col-md-3 mb-4">
            <div class="card shadow p-2">
                <img src="{{photo.image_url}}" class="img-fluid rounded">
                <p class="mt-2"><strong>{{photo.project_name}}</strong></p>
                <p>{{photo.worker_name}}</p>
            </div>
        </div>
        {% endfor %}

    </div>

     <a href="/admin-dashboard" class="btn btn-primary mt-4"><- Back</a>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </section>
</body>
</html>
