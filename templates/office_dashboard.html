<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
</head>
<body>
    <section class="container mt-5">

        <div class="header-card shadow mb-4">

            <div class="d-flex justify-content-between align-items-center">
                <div>
                <h2 class="mb-4">Supervisors Check In / Check Out</h2>
                </div>
                <ul>
                    <li class="nav-item1">
                        <a class="nav-link " href="/logout">Logout</a>
                    </li>
                </ul>

            </div>

        </div>

        <input type="hidden" id="workerName" value="{{worker_name}}">

        <input type="hidden" id="projectName" value="Supervisor">

        <div id="checkinSection">
            <div class="card p-4 shadow">
            <h5>Today's Status</h5>
            <p id="statusText">Not Checked In</p>
            <div id="attendancePreview" class="mb-3">
        </div>

        <input type="file" id="selfieInputGallery" accept="image/*" hidden>

        <div class="row">

            <div class="col-md-6 mb-3">
                <button id="checkinBtn" class="btn btn-success w-100">Check In</button>
            </div>

            <div class="col-md-6">
                <button id="checkoutBtn" class="btn btn-danger w-100">Check Out</button>
            </div>

        </div>

        </div>

        </div>

          <a href="/admin-dashboard" class="btn btn-primary mt-4"> <- Back</a>

    </section>

    <script src="{{url_for('static',filename='js/main.js')}}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
